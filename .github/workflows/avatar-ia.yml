# Avatares IA automáticos y gratis: foto (Cloudflare Workers AI) + voz (Kokoro) + video que habla (SadTalker, CPU).
# Deja los videos en avatar/ y la fábrica diaria los publica. Secretos: CF_ACCOUNT_ID y CF_API_TOKEN (solo para fotos nuevas).
name: Avatares IA
on:
  # Apagado por decisión de Luis (no le gustó la calidad de SadTalker). Solo se corre a mano.
  workflow_dispatch:
    inputs:
      num:
        description: 'Número de guion (vacío = los pendientes)'
        required: false
      prueba:
        description: 'Solo probar (no lo manda a publicar)'
        type: boolean
        default: false
      corta:
        description: 'Prueba corta (solo la primera frase, para medir tiempo)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency: avatar-ia
jobs:
  avatar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: ¿Hay trabajo?
        id: hay
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          P = json.load(open('guiones-avatar/pendientes.json'))
          hechos = {int(f.split('.')[0].split(' ')[0]) for f in os.listdir('avatar') if f[:1].isdigit()}
          n = '${{ inputs.num }}'
          hay = any(g.get('frases') and (str(g['num']) == n if n else g['num'] not in hechos) for g in P)
          print('si=' + ('1' if hay else '0'))
          PY
      - uses: actions/setup-python@v5
        if: steps.hay.outputs.si == '1'
        with:
          python-version: '3.10'
      - name: SadTalker (código y modelos, en caché)
        if: steps.hay.outputs.si == '1'
        uses: actions/cache@v4
        with:
          path: |
            ~/SadTalker
            ~/st-venv
          key: sadtalker-v3
      - name: Instalar
        if: steps.hay.outputs.si == '1'
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q numpy onnxruntime pillow
          if [ ! -d ~/SadTalker/checkpoints ]; then
            git clone -q --depth 1 https://github.com/OpenTalker/SadTalker.git ~/SadTalker
            cd ~/SadTalker && mkdir -p checkpoints gfpgan/weights
            for f in mapping_00109-model.pth.tar mapping_00229-model.pth.tar SadTalker_V0.0.2_256.safetensors; do
              curl -sSL -o checkpoints/$f https://github.com/OpenTalker/SadTalker/releases/download/v0.0.2-rc/$f; done
            curl -sSL -o gfpgan/weights/alignment_WFLW_4HG.pth https://github.com/xinntao/facexlib/releases/download/v0.1.0/alignment_WFLW_4HG.pth
            curl -sSL -o gfpgan/weights/detection_Resnet50_Final.pth https://github.com/xinntao/facexlib/releases/download/v0.1.0/detection_Resnet50_Final.pth
            curl -sSL -o gfpgan/weights/GFPGANv1.4.pth https://github.com/TencentARC/GFPGAN/releases/download/v1.3.0/GFPGANv1.4.pth
            sed -i 's/np.float, copy/np.float64, copy/' src/face3d/util/my_awing_arch.py
          fi
          if [ ! -x ~/st-venv/bin/python ]; then
            python -m venv ~/st-venv
            ~/st-venv/bin/pip install -q -U pip wheel 'setuptools<70' && ~/st-venv/bin/pip install -q torch==2.1.2 torchvision==0.16.2 --extra-index-url https://download.pytorch.org/whl/cpu
            ~/st-venv/bin/pip install -q numpy==1.23.5 face_alignment==1.3.5 imageio==2.19.3 imageio-ffmpeg==0.4.7 librosa==0.9.2 \
              numba==0.56.4 resampy==0.3.1 pydub==0.25.1 scipy==1.10.1 kornia==0.6.8 tqdm yacs==0.1.8 pyyaml joblib==1.1.0 \
              scikit-image==0.19.3 basicsr==1.4.2 facexlib==0.3.0 gfpgan==1.3.8 av safetensors && ~/st-venv/bin/pip install -q 'setuptools<70'
          fi
      - name: Hacer videos
        if: steps.hay.outputs.si == '1'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SADTALKER: /home/runner/SadTalker
          SADTALKER_PY: /home/runner/st-venv/bin/python
          AVATAR_CORTA: ${{ inputs.corta && '1' || '0' }}
          AVATAR_LIMITE: ${{ inputs.corta && '20m' || '150m' }}
        run: |
          ARGS="--max 2"
          [ -n "${{ inputs.num }}" ] && ARGS="$ARGS --num ${{ inputs.num }}"
          [ "${{ inputs.prueba }}" = "true" ] && ARGS="$ARGS --salida prueba"
          python3 avatar_ia.py $ARGS
      - name: Guardar prueba
        if: steps.hay.outputs.si == '1' && inputs.prueba
        uses: actions/upload-artifact@v4
        with:
          name: prueba-avatar
          path: prueba/
      - name: Subir prueba a la rama "pruebas"
        if: steps.hay.outputs.si == '1' && inputs.prueba
        run: |
          cd prueba && git init -q -b pruebas && git add . && git -c user.name="Fabrica Confirmapp" -c user.email=noreply@anthropic.com commit -qm "Prueba avatar IA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pruebas
      - name: Guardar en el repositorio
        if: steps.hay.outputs.si == '1' && !inputs.prueba
        run: |
          git config user.name "Fabrica Confirmapp"; git config user.email noreply@anthropic.com
          git add avatar avatar-ia guiones-avatar
          git commit -qm "Avatares IA automáticos" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
